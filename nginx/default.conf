upstream django_app {
    server web:8000;
}

server {
    listen 80;

    # 1. Handle Static Files
    location /static/ {
        alias /app/staticfiles/;
    }

    # 2. Handle Media Files (if you have uploads)
    location /media/ {
        alias /app/media/;
    }

    # 3. Proxy everything else to Gunicorn (Django)
    location / {
        proxy_pass http://django_app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }
}